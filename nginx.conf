server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/html text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ =404;
    }
}
